# Produção (Oracle). Sem "ports:" — o Caddy alcança pela rede externa "proxy".
name: piriquito
services:
  relay:
    build: { context: .., dockerfile: docker/Dockerfile }
    image: piriquito-relay:local
    container_name: piriquito-relay
    restart: unless-stopped
    volumes:
      - /home/${PIRIQUITO_DOMAIN:?}/data:/app/data
    env_file:
      - /home/${PIRIQUITO_DOMAIN:?}/secrets/env
    networks: [proxy]
    healthcheck:
      test: ["CMD", "/relay", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  proxy:
    external: true
