name: ci-infra

# Gate da infra: testes bats do deploy.sh e dos workflows, shellcheck, hadolint, actionlint
# e build multi-arch do Dockerfile (sem push).
on:
  push:
    paths: ['cron/**', 'docker/**', '.github/**']
  pull_request:
    paths: ['cron/**', 'docker/**', '.github/**']

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Instalar bats, shellcheck, hadolint, actionlint
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bats shellcheck >/dev/null
          sudo curl -fsSL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7
          sudo mv actionlint /usr/local/bin/
      - run: shellcheck cron/deploy.sh
      - run: hadolint docker/Dockerfile
      - run: actionlint
      - run: bats cron/test .github/test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: compose dev sobe e responde /healthz
        run: |
          docker compose -f docker/docker-compose.dev.yml up --build -d
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/healthz && exit 0
            sleep 1
          done
          docker compose -f docker/docker-compose.dev.yml logs
          exit 1
